services:
  mysql:
    image: mysql:8.4

    container_name: wod-explorer-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}

      MYSQL_USER: ${MYSQL_USER}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

      - ./Docker/mysql/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysqladmin ping --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  backend:
    build:
      context: ./backend

    container_name: wod-explorer-backend

    restart: unless-stopped

    environment:
      DB_URL: jdbc:mysql://mysql:3306/wod_explorer

      DB_USER: ${MYSQL_USER}

      DB_PASSWORD: ${MYSQL_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}

      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
